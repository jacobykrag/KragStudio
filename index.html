<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="Krag Studio">
    <meta property="og:image" content="https://kragstudio.dk/assets/images/Thumpnail.webp">
    <meta property="og:url" content="https://kragstudio.dk">
    <meta property="og:type" content="website">
    <title>Krag Studio</title>
    <link rel="icon" type="image/x-icon" href="/assets/svgs/Favicon.webp">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
    <link rel="preload" href="css/style.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <noscript>
        <link rel="stylesheet" href="css/style.css">
    </noscript>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js" defer></script>
    <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.prod.js" defer></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js" defer></script>
    <script type="module" src="js/app.js" defer></script>
    <script src="/js/script.js" defer></script>
</head>



<body>
    <div id="app">
        <div class="nav">
            <nav>
                <router-link to="/" class="logo">
                    <img src="assets/images/Logo.webp" alt="Krag Studio Logo" width="50">
                </router-link>
                <div class="routes">
                    <a href="https://www.artstation.com/jacob_krag" target="_blank" class="nav-link">
                        <i class="fa-brands fa-artstation"></i>
                    </a>
                    <a href="https://www.facebook.com/KragStudio" target="_blank" class="nav-link"
                        aria-label="Visit Krag Studio on Facebook">
                        <i class="fa-brands fa-facebook-f"></i>
                    </a>
                    <a href="https://www.instagram.com/krag_studio/" target="_blank" class="nav-link"
                        aria-label="Visit Krag Studio on Instagram">
                        <i class="fa-brands fa-instagram"></i>
                    </a>
                    <a href="https://www.linkedin.com/company/krag-studio/" target="_blank" class="nav-link"
                        aria-label="Visit Krag Studio on LinkedIn">
                        <i class="fa-brands fa-linkedin-in"></i>
                    </a>
                    <a href="https://www.tiktok.com/@kragstudio" target="_blank" class="nav-link"
                        aria-label="Visit Krag Studio on TikTok">
                        <i class="fa-brands fa-tiktok"></i>
                    </a>
                    <a href="https://www.youtube.com/@KragStudio" target="_blank" class="nav-link"
                        aria-label="Visit Krag Studio on YouTube">
                        <i class="fa-brands fa-youtube"></i>
                    </a>
                </div>
                <div class="menu">
                    <img class="before" src="assets/svgs/circle.svg" width="30" height="30" alt="Circle menu icon"
                        srcset="">
                </div>
            </nav>
        </div>
        <div class="mobile stop">
            <a href="https://www.artstation.com/jacob_krag" target="_blank" class="mobile-link">Artstation</a>
            <a href="https://www.facebook.com/KragStudio" target="_blank" class="mobile-link">Facebook</a>
            <a href="https://www.instagram.com/krag_studio" target="_blank" class="mobile-link">Instagram</a>
            <a href="https://www.linkedin.com/company/krag-studio/" target="_blank" class="mobile-link">LinkedIn</a>
            <a href="https://www.tiktok.com/@kragstudio" target="_blank" class="mobile-link">TikTok</a>
            <a href="https://www.youtube.com/@KragStudio" target="_blank" class="mobile-link">YouTube</a>
        </div>
        <router-view></router-view>
    </div>
</body>

</html>
